services:
  # 1. SeaweedFS (Master, Volume, Filer, and S3 Endpoint)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: converter_seaweedfs
    command: "server -dir=/data -s3 -s3.port=8333 -ip=seaweedfs"
    ports:
      - "8333:8333" # S3 endpoint
      - "9333:9333" # Master
      - "8888:8888" # Filer
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8333/ || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Redis Cache & Asynq Broker
  redis:
    image: redis:7-alpine
    container_name: converter_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Local LLM Server with Constrained Decoding (llama.cpp)
  llama-engine:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: converter_llama
    command: >
      -m /models/default.gguf
      --host 0.0.0.0
      --port 8080
      -c 2048
      --n-gpu-layers 0
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models
    restart: unless-stopped

  # 4. Backend API (Chi + SSE) with Hot-Reload
  api:
    image: golang:1.23-bookworm
    container_name: converter_api
    working_dir: /app
    volumes:
      - ../../apps/api:/app
    environment:
      PORT: "8080"
      REDIS_ADDR: "redis:6379"
      S3_ENDPOINT: "seaweedfs:8333"
      S3_BUCKET: "conversions"
      S3_ACCESS_KEY: "anykey"
      S3_SECRET_KEY: "anysecret"
      S3_USE_SSL: "false"
      LLM_BASE_URL: "http://llama-engine:8080"
      LLM_MODEL: "default"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_OWNER: "${GITHUB_OWNER:-}"
      GITHUB_REPO: "${GITHUB_REPO:-}"
      MAX_UPLOAD_SIZE_MB: "150"
    ports:
      - "8080:8080"
    command: >
      sh -c "go install github.com/air-verse/air@latest && air --build.cmd 'go build -o /tmp/main ./cmd/server' --build.bin '/tmp/main'"
    depends_on:
      seaweedfs:
        condition: service_started
      redis:
        condition: service_healthy

  # 5. Background Worker with preinstalled conversion tools
  worker:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile.worker
    container_name: converter_worker
    volumes:
      - ../../apps/api:/app
    environment:
      REDIS_ADDR: "redis:6379"
      S3_ENDPOINT: "seaweedfs:8333"
      S3_BUCKET: "conversions"
      S3_ACCESS_KEY: "anykey"
      S3_SECRET_KEY: "anysecret"
      S3_USE_SSL: "false"
      LLM_BASE_URL: "http://llama-engine:8080"
      LLM_MODEL: "default"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_OWNER: "${GITHUB_OWNER:-}"
      GITHUB_REPO: "${GITHUB_REPO:-}"
    depends_on:
      seaweedfs:
        condition: service_started
      redis:
        condition: service_healthy

  # 6. Nuxt 3 Frontend (Vite dev server)
  web:
    image: node:20-alpine
    container_name: converter_web
    working_dir: /app
    volumes:
      - ../../apps/web:/app
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NUXT_PUBLIC_API_BASE: "http://localhost:8080"
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  seaweedfs_data:
  redis_data:
