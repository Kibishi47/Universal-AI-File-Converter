name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    name: Test & Build Go API / Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        working-directory: apps/api
        run: go mod download

      - name: Build Server
        working-directory: apps/api
        run: go build -v ./cmd/server

      - name: Build Worker
        working-directory: apps/api
        run: go build -v ./cmd/worker

  test-web:
    name: Build Nuxt 3 Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Nuxt
        working-directory: apps/web
        run: npm run build
